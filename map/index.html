<style>
:root{--bg:#f6f3ee;--paper:#fffdf9;--ink:#1c1a17;--soft:#6b655c;--faint:#a39c91;--line:#e7e1d6;
--accent:#a2382b;--accent-ink:#fff;--open:#1f6b46;--openbg:#e8f2ea;--chip:#f0ebe2;--gold:#b0862f;
--chip-core:#1c1a17;--chip-core-ink:#fffdf9;
--shadow:0 1px 2px rgba(40,30,20,.06),0 8px 24px -12px rgba(40,30,20,.18);--r:16px;color-scheme:light;
--ease-out:cubic-bezier(.2,.8,.2,1);--ease-spring:cubic-bezier(.34,1.4,.64,1);--dur-1:150ms;--dur-2:220ms;--dur-3:280ms}
@media (prefers-color-scheme:dark){:root{--bg:#121110;--paper:#1b1a18;--ink:#f1ece4;--soft:#aaa396;--faint:#6f695f;--line:#2c2a26;
--accent:#e0705d;--accent-ink:#1a0f0c;--open:#7fd3a4;--openbg:#18291f;--chip:#24221f;--gold:#d9b25e;--chip-core:#f1ece4;--chip-core-ink:#121110;
--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);color-scheme:dark}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;flex-direction:column;height:100dvh}
a{color:inherit}button{font:inherit}
.serif{font-family:"Instrument Serif","Iowan Old Style",Georgia,serif;font-weight:400;letter-spacing:-.01em}
/* top bar */
.bar{position:relative;z-index:1000;flex:0 0 auto;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:saturate(1.4) blur(12px);
-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line);padding:10px 16px 10px;padding-top:max(10px,env(safe-area-inset-top))}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;max-width:1400px;margin:0 auto}
.r1{display:flex;align-items:center;gap:10px;min-width:0;flex:0 0 auto}
.switch{position:relative;display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--paper);box-shadow:var(--shadow)}
.switch a{position:relative;z-index:1;padding:5px 14px;border-radius:999px;font-size:13px;font-weight:600;text-decoration:none;color:var(--soft);
transition:color var(--dur-2) var(--ease-out),transform var(--dur-2) var(--ease-spring)}
.switch a[aria-current="page"]{color:var(--chip-core-ink)}
.switch:not(.kit-on) a[aria-current="page"]{background:var(--chip-core)}
.switch a:not([aria-current]):hover{color:var(--ink)}
.switch .kit-ind{background:var(--chip-core);border-radius:999px;box-shadow:0 2px 8px -2px rgba(0,0,0,.25)}
.switch:has(.kit-go) a[aria-current="page"]{color:var(--soft)}
.switch a.kit-go{color:var(--chip-core-ink)}
.kit-ind{position:absolute;left:0;top:0;z-index:0;pointer-events:none;opacity:0;
transition:transform var(--dur-3) var(--ease-spring),width var(--dur-3) var(--ease-spring),height var(--dur-3) var(--ease-spring),opacity var(--dur-1) linear}
.kit-tap{transition:transform var(--dur-2) var(--ease-spring),box-shadow var(--dur-2) var(--ease-out),background-color var(--dur-1),color var(--dur-1),border-color var(--dur-1),filter var(--dur-1)}
.kit-tap:active{transform:scale(.96);transition-duration:90ms}
.ttl{font-size:26px;line-height:1;margin:0;white-space:nowrap}
.seg{position:relative;display:inline-flex;background:var(--chip);border-radius:999px;padding:3px;flex:0 0 auto}
.seg button{position:relative;z-index:1;border:0;background:none;color:var(--soft);font-weight:500;font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.seg.kit-on button.on{background:none;box-shadow:none}
.seg .kit-ind{background:var(--paper);border-radius:999px;box-shadow:var(--shadow)}
.days{position:relative;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1 1 360px;min-width:0}
.days::-webkit-scrollbar{display:none}
.days button{position:relative;z-index:1;flex:0 0 auto;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:13px;padding:5px 9px;border-radius:10px;cursor:pointer;line-height:1.1;text-align:center}
.days button small{display:block;color:var(--faint);font-size:11px}
.days button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}.days button.on small{color:inherit;opacity:.7}
.days.kit-on button.on{background:none}
.days .kit-ind{background:var(--ink);border-radius:10px}
.info{font-size:12px;color:var(--soft);white-space:nowrap}
/* map */
#map{flex:1 1 auto;min-height:0;background:var(--bg);z-index:1}
.leaflet-container{font:inherit;background:var(--bg)}
body.osm.b-streets .leaflet-tile-pane{filter:saturate(.55) sepia(.12) brightness(1.02)}
.mul{mix-blend-mode:multiply}
@media (prefers-color-scheme:dark){body.osm.b-streets .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) saturate(.35) brightness(.82) contrast(.92)}
 body.b-terrain .leaflet-tile-pane{filter:brightness(.66) saturate(.85) contrast(1.05)}
 body.b-sat .leaflet-tile-pane{filter:brightness(.72) saturate(.9)}}
/* basemap switcher */
.bm{position:absolute;z-index:950;top:12px;left:58px;display:flex;align-items:center;gap:0;background:color-mix(in srgb,var(--paper) 88%,transparent);
backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border:1px solid var(--line);box-shadow:var(--shadow)}
.bm button{display:inline-flex;align-items:center;gap:6px}
.bm svg{width:15px;height:15px;flex:0 0 auto;opacity:.8}
.leaflet-touch .leaflet-bar,.leaflet-bar{border:1px solid var(--line)!important;border-radius:12px;overflow:hidden;box-shadow:var(--shadow)!important}
.leaflet-control-attribution{font-size:10px;background:color-mix(in srgb,var(--paper) 80%,transparent)!important;color:var(--soft)}
.leaflet-control-attribution a{color:var(--soft)}
.leaflet-bar a{background:var(--paper);color:var(--ink);border-color:var(--line)!important}
.leaflet-bar a:hover{background:var(--chip)}
.pinw{background:none;border:0;display:grid!important;place-items:center}
.zfar .pin{width:27px;height:27px;font-size:10.5px;border-width:1.5px}.zfar .pin.mono{font-size:15px}.zfar .pin i{top:-8px;right:-10px;min-width:17px;height:17px;font-size:10px}
.pin i .n1{display:none}.pin i .w{margin-left:.28em}.pin i .n1{margin-left:1px}.zfar .pin i .w{display:none}.zfar .pin i .n1{display:inline}
.pin{position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--sc,#7a7368);color:#fff;font-weight:700;font-size:12.5px;
font-variant-numeric:tabular-nums;line-height:1;border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35);cursor:pointer;transition:transform .15s ease,opacity .2s}
.pin.mono{font-family:"Instrument Serif",Georgia,serif;font-size:19px;font-weight:400;background:#7a7368;padding-top:2px}
.pin.bar{border-radius:10px}
.pin.dim{opacity:.42;filter:grayscale(.9)}
.pin.approx{border-style:dashed}
.pin.sel{transform:scale(1.28);box-shadow:0 0 0 3px var(--paper),0 0 0 5.5px var(--ink),0 10px 22px rgba(0,0,0,.45);animation:pinPop 420ms var(--ease-spring)}
.pin.sel.dim{opacity:1;filter:none}
.pin.sel::after{content:"";position:absolute;inset:-4px;border-radius:inherit;border:2.5px solid var(--sc,#7a7368);animation:halo 1.8s var(--ease-out) infinite;pointer-events:none}
@keyframes pinPop{0%{transform:scale(1)}55%{transform:scale(1.4)}100%{transform:scale(1.28)}}
@keyframes halo{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.1);opacity:0}}
.pin:hover{transform:scale(1.12)}.pin.sel:hover{transform:scale(1.28)}
.pin:active{transform:scale(.94)}
/* clusters */
.cluw{background:none;border:0}
.clu{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;align-content:center;gap:0;background:var(--sc,#7a7368);color:#fff;
border:2.5px solid #fff;box-shadow:0 0 0 5px color-mix(in srgb,var(--sc,#7a7368) 28%,transparent),0 4px 14px rgba(0,0,0,.38);cursor:pointer;line-height:1;
font-variant-numeric:tabular-nums;transition:transform var(--dur-2) var(--ease-spring)}
.clu:hover{transform:scale(1.08)}.clu:active{transform:scale(.94)}
.clu b{font-size:15px;font-weight:750;line-height:1}
.clu small{font-size:9.5px;font-weight:700;opacity:.92;margin-top:1px;letter-spacing:.02em}
.clu i{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);min-width:19px;height:19px;padding:0 6px;border-radius:999px;background:var(--open);color:var(--paper);font-style:normal;
font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--paper);white-space:nowrap}
.clu.dim{filter:grayscale(.85);opacity:.6}
.leaflet-cluster-anim .leaflet-marker-icon,.leaflet-cluster-anim .leaflet-marker-shadow{transition:transform .3s var(--ease-out),opacity .3s ease-in}
.tip{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);font-weight:600;font-size:12.5px;padding:4px 9px}
.tip::before{display:none}
.pin i{white-space:nowrap;position:absolute;top:-7px;right:-9px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--open);color:var(--paper);
font-style:normal;font-family:Inter,sans-serif;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--paper);line-height:1}
.legend{position:absolute;left:12px;bottom:22px;z-index:900;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:11px;color:var(--soft);box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:4px 10px;max-width:calc(100% - 24px)}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend b{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend .sq{border-radius:3px;background:#7a7368}
.empty-msg{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:900;background:var(--paper);border:1px solid var(--line);border-radius:999px;
padding:6px 14px;font-size:13px;color:var(--soft);box-shadow:var(--shadow);white-space:nowrap}
.stage{position:relative;flex:1 1 auto;min-height:0;display:flex}
/* sheet / side card */
.sheet{position:absolute;z-index:1100;background:var(--paper);color:var(--ink);box-shadow:0 -10px 40px -10px rgba(0,0,0,.35);overflow-y:auto;overscroll-behavior:contain;
transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.sheet{left:0;right:0;bottom:0;max-height:64%;border-radius:22px 22px 0 0;transform:translateY(105%);padding-bottom:env(safe-area-inset-bottom);
border-top:1px solid var(--line);box-shadow:0 -14px 44px -12px rgba(0,0,0,.4)}
.sheet.drag{transition:none}
.sheet.open{transform:none}
@media (min-width:860px){.sheet{left:auto;right:16px;top:16px;bottom:16px;width:390px;max-height:none;border-radius:var(--r);border:1px solid var(--line);transform:translateX(calc(100% + 24px))}
.sheet.open{transform:none}.grab{display:none}.legend{bottom:22px}}
.grab{width:40px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--faint) 55%,transparent);margin:8px auto 0;flex:0 0 auto;touch-action:none}
.close{position:absolute;top:10px;right:10px;z-index:3;width:34px;height:34px;border-radius:50%;border:0;background:rgba(20,16,12,.5);color:#fff;font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;
-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform var(--dur-2) var(--ease-spring),background-color var(--dur-1)}
.close:hover{background:rgba(20,16,12,.7)}.close:active{transform:scale(.9)}
.ph{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#3b2a22,#7a4a33 55%,#c08a57);flex:0 0 auto;overflow:hidden}
.sheet .ph{margin:10px 12px 0;border-radius:14px}

.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .mono{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.85);font-size:56px}
.ph::after{pointer-events:none;content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.5),rgba(0,0,0,0) 55%)}
.tag25{position:absolute;left:12px;bottom:10px;z-index:2;color:#fff;font-size:11px;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.credit{position:absolute;right:10px;bottom:8px;z-index:2;color:rgba(255,255,255,.85);font-size:10px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.body{padding:14px 16px 18px;display:flex;flex-direction:column;gap:10px}
.hd{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.name{font-size:30px;line-height:1.02;margin:0}
.sub{color:var(--soft);font-size:13px;margin-top:3px}
.score{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.score .n{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px;color:#fff;background:var(--sc,#2d6a4f);box-shadow:0 3px 10px rgba(0,0,0,.25)}
.score .l{font-size:11px;line-height:1.2;text-align:right;color:var(--soft)}.score .l b{display:block;font-size:12px;color:var(--ink)}

.vtags{display:flex;flex-wrap:wrap;gap:5px}
.vtag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:999px;padding:2px 8px}
.blurb{color:var(--soft);font-size:13px;margin:0}

.lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600}
.dishes{display:flex;flex-wrap:wrap;gap:6px}
.dish{font-size:12px;background:var(--chip);border-radius:999px;padding:3px 9px}

.strip{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}

.times{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;align-items:center}
.time{display:inline-block;text-decoration:none;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--open);border:1.5px solid var(--open);border-radius:9px;padding:6px 10px}
.time{transition:transform var(--dur-2) var(--ease-spring),background-color var(--dur-1),color var(--dur-1)}
.time:hover{background:var(--open);color:var(--paper)}.time:active{transform:scale(.95)}
.time.stale{opacity:.55;border-style:dashed}

.book{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;background:var(--accent);color:var(--accent-ink);font-weight:650;font-size:16px;padding:14px;border-radius:12px}
.book{transition:transform var(--dur-2) var(--ease-spring),filter var(--dur-1);box-shadow:0 6px 18px -8px color-mix(in srgb,var(--accent) 70%,transparent)}

<script>
// tactile layer: sliding selection pill + press feedback + page-switch slide (mirrors render.py KIT_JS / trip/index.html)
(() => {
  const RM = matchMedia('(prefers-reduced-motion: reduce)'), still = () => RM.matches;
  const buzz = () => { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} };
  function place(ind, p, anim) {
    if (!anim) ind.style.transition = 'none';
    ind.style.width = p.w + 'px'; ind.style.height = p.h + 'px';
    ind.style.transform = `translate3d(${p.x}px,${p.y}px,0)`; ind.style.opacity = 1;
    if (!anim) { void ind.offsetWidth; ind.style.transition = ''; }
  }
  function slide(box, target, anim = true) {
    if (!box) return;
    let ind = box._kInd;
    if (!ind) {
      ind = box._kInd = document.createElement('span'); ind.className = 'kit-ind'; ind.setAttribute('aria-hidden', 'true');
      box.classList.add('kit-on');
      if ('ResizeObserver' in window) new ResizeObserver(() => slide(box, null, false)).observe(box);
    }
    if (ind.parentNode !== box) { box.prepend(ind); if (box._kPos) place(ind, box._kPos, false); }
    const a = target || box.querySelector('.kit-go') || box.querySelector('.on,[aria-current="page"]');
    if (!a) { ind.style.opacity = 0; box._kPos = null; return; }
    if (!a.offsetWidth) return;
    const p = {x: a.offsetLeft, y: a.offsetTop, w: a.offsetWidth, h: a.offsetHeight};
    place(ind, p, anim && !!box._kPos && !still());
    box._kPos = p;
    if (box.scrollWidth > box.clientWidth + 2) {
      const l = box.scrollLeft, r = l + box.clientWidth;
      if (p.x < l || p.x + p.w > r) box.scrollTo({left: p.x - (box.clientWidth - p.w) / 2, behavior: still() ? 'auto' : 'smooth'});
    }
  }
  document.addEventListener('click', e => { if (e.target.closest && e.target.closest('.seg button,.days button,.strip button,.time,.book,.sbtn,.switch a')) buzz(); }, true);
  const boot = () => document.querySelectorAll('.switch').forEach(sw => {
    slide(sw, null, false);
    sw.addEventListener('click', e => {
      const a = e.target.closest('a');
      if (!a || a.hasAttribute('aria-current') || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button || still()) return;
      e.preventDefault(); sw.querySelectorAll('a').forEach(x => x.classList.toggle('kit-go', x === a)); slide(sw, a);
      setTimeout(() => { location.href = a.href; }, 180);
    });
  });
  addEventListener('pageshow', e => { if (e.persisted) document.querySelectorAll('.switch').forEach(sw => { sw.querySelectorAll('.kit-go').forEach(x => x.classList.remove('kit-go')); slide(sw, null, false); }); });
  window.Kit = {slide, buzz, still};
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

<script>
(async () => {
const $ = (s, e = document) => e.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const dow = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US', {weekday: 'short'});
const dnum = d => { const x = new Date(d + 'T12:00:00'); return (x.getMonth() + 1) + '/' + x.getDate(); };
const h24 = t => { const m = String(t).match(/(\d+):(\d+)\s*([AP]M)/i); if (!m) return null; let h = +m[1] % 12; if (/p/i.test(m[3])) h += 12; return String(h).padStart(2, '0') + ':' + m[2]; };
const mins = t => { const x = h24(t); return x ? (+x.slice(0, 2)) * 60 + (+x.slice(3)) : null; };
const short = t => t.replace(':00', '').replace(' PM', 'p').replace(' AM', 'a');
const ONLINE = ['resy', 'opentable', 'sevenrooms', 'tock'];
const PLATFORM = {resy: 'Resy', opentable: 'OpenTable', sevenrooms: 'SevenRooms', tock: 'Tock', phone: 'Phone', walkin: 'Walk-in', unknown: 'Their site'};
const WINDOWS = {any: [0, 1e9], early: [0, 18 * 60 + 59], prime: [19 * 60, 20 * 60 + 30], late: [20 * 60 + 31, 1e9]};
const scoreCol = a => a == null ? '#7a7368' : a >= 9 ? '#1f6b46' : a >= 8.5 ? '#2f7d55' : a >= 8 ? '#5b8a3a' : a >= 7 ? '#a07a20' : '#a2382b';

// ---- data (fetched live so the 3-hourly results.json update shows without a rebuild) ----
const get = (u, fb) => fetch(u, {cache: 'no-cache'}).then(r => r.ok ? r.text() : null).catch(() => null).then(t => t == null ? fb : t);
const json = t => { try { return typeof t === 'string' ? JSON.parse(t) : t; } catch (e) { return null; } };
const [rT, vT, mT, bT, gT, viT] = await Promise.all([get('../results.json'), get('../venues.json', '[]'), get('../media.json', '{}'),
  get('../beli_avgs.jsonl', ''), get('./geo.json', '{}'), get('../vibes.json', '{}')]);
const res = json(rT);
if (!res) { $('#emsg').textContent = "Couldn't load results.json"; $('#emsg').classList.remove('hide'); return; }
const meta = Object.fromEntries((json(vT) || []).map(v => [v.name, v]));
const media = json(mT) || {}, geo = (json(gT) || {}).venues || {}, vibes = json(viT) || {};
const beli = {}; (bT || '').split('\n').forEach(l => { const b = json(l.trim() || 'null'); if (b && b.name) beli[b.name] = b; });
const P = res.party || 4, dates = res.dates || [];
const V = res.venues.map(r => {
  const m = meta[r.name] || {}, md = media[r.name] || {}, b = beli[r.name], vb = vibes[r.name];
  const avg = b && b.avg != null ? b.avg : (m.beli_avg ?? r.beli_avg ?? null);
  const rt = b && b.avg != null ? b.ratings : (m.beli_ratings ?? r.beli_ratings ?? null);
  return {
    name: r.name, kind: m.kind || r.kind || 'restaurant', platform: m.platform || r.platform, id: m.id ?? r.id,
    url: m.url || r.url, phone: m.phone || r.phone, hood: m.hood || r.hood, top25: m.beli_rank ?? r.beli_rank,
    avg, ratings: rt, ratings_label: rt ? (b && /rounded/.test(b.note || '') ? Math.floor(rt / 1000) + 'k' : rt.toLocaleString('en-US')) : null,
    dishes: ((b && b.dishes) || []).filter(d => d.dish).map(d => ({dish: d.dish.replace('... (truncated)', '…'), count: d.count})),
    closed: /^CLOSED/.test(m.notes || r.notes || ''), note: m.public_note || '',
    imgs: md.images || [], img_src: md.img_src, website: md.website, menu: md.menu, cuisine: md.cuisine || (b && b.beli_type) || '',
    blurb: md.blurb, vibe: (vb && typeof vb === 'object') ? vb : null,
    slots: r.slots || {}, status: r.status || {}, day_notes: r.day_notes || {}, geo: geo[r.name] || null,
  };

// ---- same logic as page.js ----
let state = {kind: 'restaurant', day: 'all', when: 'any'};
try { const s = JSON.parse(localStorage.getItem('drw3') || '{}'); ['kind', 'day', 'when'].forEach(k => { if (s[k]) state[k] = s[k]; }); } catch (e) {}
try { Object.assign(state, JSON.parse(localStorage.getItem('drwmap1') || '{}')); } catch (e) {}

const slotsFor = (v, d) => { const [a, b] = WINDOWS[state.when] || WINDOWS.any; return (v.slots[d] || []).filter(t => { const m = mins(t); return m == null || (m >= a && m <= b); }); };

const firstOpen = v => dates.findIndex(d => slotsFor(v, d).length);

function bookUrl(v, d, t) {
  const u = v.url; if (!u) return null; const hm = t ? h24(t) : null;

    switch (v.platform) {

      case 'sevenrooms': { const x = new URL(u); if (d) x.searchParams.set('date', d); x.searchParams.set('party_size', P); if (hm) x.searchParams.set('start_time', hm); return x + ''; }
      case 'tock': { const x = new URL(u.replace(/\/$/, '') + '/search'); if (d) x.searchParams.set('date', d); x.searchParams.set('size', P); if (hm) x.searchParams.set('time', hm); return x + ''; }
      default: return u;

}
function primaryBtn(v, d) {

  if (v.closed) return `<span class="book ghost">Closed for now</span>`;
  if (ONLINE.includes(v.platform) && v.url) return `<a class="book" href="${esc(bookUrl(v, d))}" target="_blank" rel="noopener">Book on ${esc(plat)} <span aria-hidden="true">→</span></a>`;
  if (v.platform === 'phone' && v.phone) return `<a class="book" href="tel:${esc(v.phone)}">Call to book · ${esc(v.phone)}</a>`;
  if (v.platform === 'walkin') return `<span class="book ghost">Walk-in only · no reservations</span>`;
  if (v.url) return `<a class="book" href="${esc(v.url)}" target="_blank" rel="noopener">Book on their site <span aria-hidden="true">→</span></a>`;
  return `<span class="book ghost">No online booking</span>`;
}
function secondary(v) {
  const q = encodeURIComponent(v.name + ' Dallas TX');
  // with a start point set, Directions opens Google Maps from it (only when the viewer taps it)
  const dir = !v.geo ? '' : (START && !isStartVenue(v)) ? `https://www.google.com/maps/dir/?api=1&origin=${START.lat.toFixed(5)},${START.lng.toFixed(5)}&destination=${q}&travelmode=driving`
    : `https://www.google.com/maps/search/?api=1&query=${q}`;
  return [v.menu ? `<a class="sbtn" href="${esc(v.menu)}" target="_blank" rel="noopener">Menu</a>` : '',
    v.website ? `<a class="sbtn" href="${esc(v.website)}" target="_blank" rel="noopener">Site</a>` : '',
    (v.phone && v.platform !== 'phone') ? `<a class="sbtn" href="tel:${esc(v.phone)}" title="${esc(v.phone)}">Call</a>` : '',
    dir ? `<a class="sbtn" href="${esc(dir)}" target="_blank" rel="noopener">Directions</a>` : '',
    v.geo ? (isStartVenue(v) ? `<span class="sbtn" aria-disabled="true" style="opacity:.6">Starting here</span>` : `<button class="sbtn kit-tap" data-starthere>Start here</button>`) : ''].join('');
}
function timesHtml(v, d) {
  const s = slotsFor(v, d), nt = v.day_notes[d] || '', stale = /^stale/.test(nt);
  if (s.length) return s.map(t => `<a class="time${stale ? ' stale' : ''}" href="${esc(bookUrl(v, d, t))}" target="_blank" rel="noopener" title="Book ${dow(d)} ${dnum(d)} at ${esc(t)}${stale ? ' (older check)' : ''}">${esc(short(t))}</a>`).join('');
  const why = /closed/i.test(nt) ? 'closed' : /error/.test(v.status[d] || '') ? 'check failed' : (v.slots[d] || []).length ? 'nothing in this time range' : 'no tables for ' + P;
  return `<span class="empty">${dow(d)} ${dnum(d)}: ${why}</span>`;
}
function stripHtml(v, cur) {
  return '<div class="strip">' + dates.map(d => {
    const n = slotsFor(v, d).length, nt = v.day_notes[d] || '';
    return `<button data-d="${d}" class="${n ? 'has' : ''}${d === cur ? ' sel' : ''}" title="${esc(nt || (n + ' open times'))}">${dow(d)}<b>${n ? n : (/closed/i.test(nt) ? '–' : '0')}</b></button>`;

}

// ---- map ----
const dark = matchMedia('(prefers-color-scheme: dark)');
const map = L.map('map', {zoomControl: true, attributionControl: true, wheelPxPerZoomLevel: 90}).setView([32.81, -96.80], 12);
map.zoomControl.setPosition('topleft');
const CARTO = s => `https://{s}.basemaps.cartocdn.com/${s}/{z}/{x}/{y}{r}.png`;
const ESRI = s => `https://server.arcgisonline.com/ArcGIS/rest/services/${s}/MapServer/tile/{z}/{y}/{x}`;
const A = (h, t) => `<a href="${h}" target="_blank" rel="noopener">${t}</a>`;
const OSM_ATT = '&copy; ' + A('https://www.openstreetmap.org/copyright', 'OpenStreetMap') + ' contributors';
const ESRI_TOPO_ATT = 'Tiles &copy; ' + A('https://www.esri.com', 'Esri') + ' &mdash; Esri, USGS, NOAA, HERE, Garmin, FAO, NPS, ' + OSM_ATT + ', and the GIS User Community';
const ESRI_SAT_ATT = 'Imagery &copy; ' + A('https://www.esri.com', 'Esri') + ' &mdash; Maxar, Earthstar Geographics, USDA, USGS, and the GIS User Community';
const CARTO_ATT = '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>';
// Basemaps: Streets (warm CARTO / OSM), Terrain (Esri shaded relief with the Esri topo map multiplied on top, so Dallas's
// creek valleys + the Trinity floodplain read as relief under crisp labels), Satellite (Esri imagery + roads + place labels).
let tiles = null, tileOk = 0, tileErr = 0, useOSM = false;
let base = 'streets'; try { base = localStorage.getItem('drwBase') || 'streets'; } catch (e) {}
if (!['streets', 'terrain', 'sat'].includes(base)) base = 'streets';
function streetsLayer() {

    ? L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: OSM_ATT})

function setTiles() {

      L.tileLayer(ESRI('World_Topo_Map'), {maxZoom: 19, className: 'mul'})])

      L.tileLayer(ESRI('World_Imagery'), {maxZoom: 19, attribution: ESRI_SAT_ATT}),
      L.tileLayer(ESRI('Reference/World_Transportation'), {maxZoom: 19, opacity: .5}),
      L.tileLayer(ESRI('Reference/World_Boundaries_and_Places'), {maxZoom: 19})])

// routing: OSRM public demo, only on pin tap, one request at a time, cached in memory; straight-line fallback
const rCache = new Map(); let rQueue = Promise.resolve();
const ck = (mode, a, b) => `${mode}|${a.lat.toFixed(5)},${a.lng.toFixed(5)}|${b.lat.toFixed(5)},${b.lng.toFixed(5)}`;
function osrm(mode, a, b) {

    if (rCache.has(key)) return rCache.get(key);
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 7000);

      const r = await fetch(`https://router.project-osrm.org/route/v1/${mode}/${a.lng.toFixed(6)},${a.lat.toFixed(6)};${b.lng.toFixed(6)},${b.lat.toFixed(6)}?overview=full&geometries=geojson`, {signal: ctl.signal});

      if (!rt) throw 0;

      // the demo server answers /foot/ with car timings; never claim walking faster than ~5 km/h
      if (mode === 'foot') min = Math.max(min, dk * 12);

  const b = L.latLngBounds(r.line), sz = map.getSize(), desk = innerWidth >= 860;
  const free = L.bounds(L.point(16, 140), L.point(sz.x - (desk ? 420 : 16), desk ? sz.y - 16 : sz.y - sheet.getBoundingClientRect().height - 12));
  const inFree = [b.getNorthWest(), b.getSouthEast()].every(ll => free.contains(map.latLngToContainerPoint(ll)));
  if (!inFree) map.fitBounds(b.pad(.15), {animate: !Kit.still(), maxZoom: 15,
    paddingTopLeft: [24, 150], paddingBottomRight: [(innerWidth >= 860 ? 420 : 0) + 24, innerWidth < 860 ? Math.round(sheet.getBoundingClientRect().height) + 20 : 24]});
}
const travKey = v => START && v.geo ? START.id + '>' + v.name : '';
function travHtml(v) {
  if (!START || !v.geo) return '';
  if (isStartVenue(v)) return `<div class="trav"><div class="tl">Getting around</div><div class="tr">${IC.pin}This is your start point<span></span></div></div>`;
  return `<div class="trav ld" id="trav" data-k="${esc(travKey(v))}"><div class="tl">From ${esc(START.name)}</div><div class="tr">${IC.car}Working out the route…</div></div>`;
}
const tline = (r, mode) => `<div class="tr">${IC[mode === 'foot' ? 'walk' : 'car']}${fmtMin(r.min)} ${mode === 'foot' ? 'walk' : 'drive'}<span>· ${fmtKm(r.km)}</span>${r.approx ? '<span class="ap">approx.</span>' : ''}</div>`;
async function travelFor(v) {
  if (!START || !v.geo || isStartVenue(v)) { clearRoute(); return; }
  const a = {lat: START.lat, lng: START.lng}, b = {lat: v.geo.lat, lng: v.geo.lng}, key = travKey(v);
  const still = () => selName === v.name && travKey(v) === key;
  let drive = await osrm('driving', a, b); if (!still()) return;
  drive = drive || approxOf('driving', a, b);
  let walk = null;
  if (Math.min(km(a, b), drive.km) < 2) { walk = await osrm('foot', a, b); if (!still()) return; walk = walk || approxOf('foot', a, b); }
  const el = document.getElementById('trav'); if (!el || el.dataset.k !== key) return;
  el.classList.remove('ld');
  el.innerHTML = `<div class="tl">From ${esc(START.name)}</div>${walk ? tline(walk, 'foot') + tline(drive, 'driving') : tline(drive, 'driving')}`;
  drawRoute(walk && walk.km < 1.2 ? walk : drive);
}

// "Start from" control
const fromEl = $('#from');
function startOpts() {
  const out = SLOTS.map(s => Object.assign({}, s, places.find(p => p.id === s.id) || {unset: true}));
  places.filter(p => !SLOTS.some(s => s.id === p.id)).forEach(p => out.push(p));
  return out;
}
function renderFrom() {
  const opts = startOpts();
  const btn = (id, kind, label, extra = '') => `<button data-st="${esc(id)}" class="kit-tap${START && START.id === id ? ' on' : ''}${extra}" aria-pressed="${!!(START && START.id === id)}">${IC[kind]}${esc(label)}</button>`;
  fromEl.innerHTML = `<span class="flab">From</span><div class="seg" id="fromSeg" role="group" aria-label="Start from">`
    + btn('me', 'me', 'Me')
    + opts.map(o => btn(o.id, o.kind === 'friend' ? 'friend' : o.kind === 'home' ? 'home' : 'custom', o.name, o.unset ? ' unset' : '')).join('')
    + (START && START.kind === 'pin' ? btn(START.id, 'pin', START.name.length > 16 ? START.name.slice(0, 15) + '…' : START.name) : '')
    + `</div><button class="rb kit-tap" id="fromAdd" title="Saved places" aria-label="Add or edit saved places">${IC.plus}</button>`
    + `<button class="rb kit-tap${nearOn ? ' on' : ''}" id="fromNear" title="Sort by distance" aria-label="Sort by distance" aria-pressed="${nearOn}"${START ? '' : ' disabled'}>${IC.sort}</button>`;
  Kit.slide($('#fromSeg'), null, false);
  renderNear();
}
L.DomEvent.disableClickPropagation(fromEl); L.DomEvent.disableScrollPropagation(fromEl);
fromEl.addEventListener('click', e => {
  const b = e.target.closest('[data-st]');
  if (b) {
    const id = b.dataset.st;
    if (START && START.id === id) return setStart(null);
    if (id === 'me') return locate(b);
    const p = places.find(x => x.id === id);
    if (p) return setStart(p);
    return openManage(id);
  }
  if (e.target.closest('#fromAdd')) return $('#pmg').classList.contains('hide') ? openManage() : closeManage();
  if (e.target.closest('#fromNear') && START) { nearOn = !nearOn; try { localStorage.setItem('drwNear', nearOn ? '1' : '0'); } catch (er) {} renderFrom(); }
});
function locate(b) {
  if (!navigator.geolocation) return toast('Location isn’t available in this browser');
  b.classList.add('unset'); toast('Finding you…');
  navigator.geolocation.getCurrentPosition(p => { toast('Starting from your location'); setStart({id: 'me', kind: 'me', name: 'your location', lat: p.coords.latitude, lng: p.coords.longitude}); },
    err => { b.classList.remove('unset'); toast(err.code === 1 ? 'Location permission was declined' : 'Couldn’t find your location'); }, {enableHighAccuracy: true, timeout: 12000, maximumAge: 60000});
}
function setStart(p) {
  START = p ? {id: p.id, kind: p.kind, name: p.name, lat: +p.lat, lng: +p.lng} : null;
  try { if (START && START.kind !== 'me' && START.kind !== 'pin') localStorage.setItem('drwStart', START.id); else localStorage.removeItem('drwStart'); } catch (e) {}
  if (!START) clearRoute();
  drawStart(); renderFrom(); render(false);
  if (START && !selName && !map.getBounds().contains([START.lat, START.lng])) map.panTo([START.lat, START.lng], {animate: !Kit.still()});
}
// nearest strip + pins z-ordered by distance when "Sort by distance" is on
function renderNear(repaint = true) {
  const el = $('#near'), show = nearOn && START;
  el.classList.toggle('hide', !show);
  if (repaint) markers.forEach((mk, n) => paint(n));
  if (!show) return;
  const pool = V.filter(v => v.geo && (state.kind === 'all' || v.kind === state.kind) && !isStartVenue(v))
    .map(v => ({v, d: km(START, v.geo)})).sort((a, b) => a.d - b.d).slice(0, 5);
  el.innerHTML = `<span class="nl">Closest to ${esc(START.name)}</span>` + pool.map(({v, d}) =>
    `<button class="kit-tap" data-near="${esc(v.name)}"><b style="--sc:${scoreCol(v.avg)}">${v.avg != null ? v.avg.toFixed(1) : esc(v.name.replace(/^the\s+/i, '')[0])}</b>${esc(v.name)}<small>${fmtKm(d)}</small></button>`).join('');
  el.querySelectorAll('[data-near]').forEach(b => b.onclick = () => openSheet(b.dataset.near));
}
L.DomEvent.disableClickPropagation($('#near')); L.DomEvent.disableScrollPropagation($('#near'));

// manage sheet: add / edit / delete saved places
const pmg = $('#pmg');
L.DomEvent.disableClickPropagation(pmg); L.DomEvent.disableScrollPropagation(pmg);
let editId = null;
function openManage(id) {
  editId = id || null; pmg.classList.remove('hide'); paintManage();
  const inp = $('#pmAddr', pmg); if (inp && editId) inp.focus();
}
function closeManage() { pmg.classList.add('hide'); editId = null; }
function paintManage(msg = '', err = false) {
  const opts = startOpts();
  const cur = editId ? (opts.find(o => o.id === editId) || {id: editId, kind: 'custom', name: ''}) : null;
  const isSlot = cur && SLOTS.some(s => s.id === cur.id);
  pmg.innerHTML = `<button class="x" aria-label="Close">×</button><h3 class="serif">Saved places</h3>
   <p class="note">${IC.lock}Saved only on this device, never on the site.</p>
   ${opts.map(o => `<div class="row"><div class="nm">${IC[o.kind === 'friend' ? 'friend' : o.kind === 'home' ? 'home' : 'custom']}${esc(o.name)}${o.unset ? '<small>not set</small>' : ''}</div>
     <button class="mini" data-ed="${esc(o.id)}">${o.unset ? 'Add' : 'Edit'}</button>${o.unset ? '' : `<button class="mini warn" data-del="${esc(o.id)}">Delete</button>`}</div>`).join('')}
   ${cur ? '' : `<button class="mini" data-ed="new" style="align-self:flex-start">+ Add a place</button>${msg ? `<div class="msg">${esc(msg)}</div>` : ''}`}
   ${cur ? `<form id="pmForm" autocomplete="off">
     ${isSlot ? `<div class="lab">${esc(cur.name)}</div>` : `<label for="pmName">Name</label><input id="pmName" maxlength="24" value="${esc(cur.name || '')}" placeholder="e.g. Office" required>`}
     <label for="pmAddr">Address</label><input id="pmAddr" inputmode="search" autocomplete="off" placeholder="Street address or place, Dallas" required>
     <div class="fa"><button class="book kit-tap" type="submit">Save</button><button class="mini" type="button" data-cancel>Cancel</button></div>
     <div class="msg${err ? ' err' : ''}">${esc(msg) || 'Looked up once with OpenStreetMap when you tap Save. Only the map point is kept.'}</div></form>` : ''}`;
  $('.x', pmg).onclick = closeManage;
  pmg.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => { editId = b.dataset.ed === 'new' ? 'c' + Date.now().toString(36) : b.dataset.ed; paintManage(); const i = $('#pmName', pmg) || $('#pmAddr', pmg); i && i.focus(); });
  pmg.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Sure?'; return; }
    const id = b.dataset.del; places = places.filter(p => p.id !== id); savePlaces(places);
    if (START && START.id === id) setStart(null); else renderFrom();
    if (editId === id) editId = null; paintManage('Deleted.');
  });
  const c = $('[data-cancel]', pmg); if (c) c.onclick = () => { editId = null; paintManage(); };
  const f = $('#pmForm', pmg); if (f) f.onsubmit = async e => {
    e.preventDefault();
    const nameIn = $('#pmName', pmg), q = $('#pmAddr', pmg).value.trim(), name = isSlot ? cur.name : (nameIn.value.trim() || 'Place');
    if (q.length < 3) return paintManageMsg('Type an address first.', true);
    paintManageMsg('Looking it up…');
    let hit = null;
    try {
      const ctl = new AbortController(); setTimeout(() => ctl.abort(), 9000);
      const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q=' + encodeURIComponent(q), {signal: ctl.signal, headers: {'Accept-Language': 'en'}});
      const j = r.ok ? await r.json() : null; hit = j && j[0];
    } catch (er) {}
    if (!hit) return paintManageMsg('Couldn’t find that address. Try adding the city or ZIP.', true);
    const p = {id: cur.id, kind: isSlot ? cur.kind : 'custom', name, lat: +(+hit.lat).toFixed(5), lng: +(+hit.lon).toFixed(5)};
    places = places.filter(x => x.id !== p.id).concat(p); savePlaces(places);
    editId = null; setStart(p); paintManage(`Saved ${name}. Now starting from there.`);
  };
}
const paintManageMsg = (t, err) => { const m = $('.msg', pmg); if (m) { m.textContent = t; m.classList.toggle('err', !!err); } };
addEventListener('keydown', e => { if (e.key === 'Escape' && !pmg.classList.contains('hide')) { closeManage(); e.stopImmediatePropagation(); } }, true);
// pins nearer the start sit on top when sorting by distance
const _paint = paint;
paint = function (n) { _paint(n); if (!(nearOn && START)) return; const mk = markers.get(n), v = V.find(x => x.name === n); if (!mk || !v || n === selName) return;
  mk.setZIndexOffset(5000 - Math.round(km(START, v.geo) * 100)); };
try { const sid = localStorage.getItem('drwStart'); const p = sid && places.find(x => x.id === sid); if (p) { START = {id: p.id, kind: p.kind, name: p.name, lat: +p.lat, lng: +p.lng}; drawStart(); } } catch (e) {}
renderFrom();
document.querySelectorAll('.seg.kind button,.seg.when button').forEach(b => b.classList.add('kit-tap'));
document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { state.kind = b.dataset.k; if (selName && !(state.kind === 'all' || V.find(v => v.name === selName).kind === state.kind)) closeSheet(); render(); });
document.querySelectorAll('[data-when]').forEach(b => b.onclick = () => { state.when = b.dataset.when; render(false); });
render();
window.__map = {map, V, state, openSheet, closeSheet, setStart, get start() { return START; }, missing, cluster, markers, get base() { return base; }};
})();
</script>
